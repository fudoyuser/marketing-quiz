<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz chuyên sâu về khái niệm và mô hình marketing: 3Cs, 4P/7P, STP, SWOT, Five Forces, Ansoff, BCG, PESTEL, AIDA, Brand Equity, PLC, NPS.">
<title>Marketing Quiz Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Giao diện: giáo trình marketing — giấy kem, mực xanh đậm. Mỗi nhóm chủ đề có màu nhấn riêng */
:root {
  --bg: #f6f2ea; --card: #fffdf8; --opt: #fbf8f1; --ink: #1d2433; --muted: #69707f; --line: #e3dccd;
  --accent: #d6452f; --accent-ink: #ffffff;
  --ok: #2f8a5b; --ok-soft: #e2f2e8; --no: #c43d2e; --no-soft: #fbe4df;
  --g-strategy: #2c5fb3; --g-customer: #d6452f; --g-brand: #7a4bb5; --g-metric: #2f8a5b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --card: #1a1f29; --opt: #1f2531; --ink: #eef0f4; --muted: #9aa2b2; --line: #2d3442;
    --accent: #ff7a5c; --accent-ink: #1a0f0b;
    --ok: #5fd09a; --ok-soft: #173a2b; --no: #ff8270; --no-soft: #3d1f1c;
    --g-strategy: #79a6ff; --g-customer: #ff7a5c; --g-brand: #b996f0; --g-metric: #5fd09a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --card: #1a1f29; --opt: #1f2531; --ink: #eef0f4; --muted: #9aa2b2; --line: #2d3442;
  --accent: #ff7a5c; --accent-ink: #1a0f0b;
  --ok: #5fd09a; --ok-soft: #173a2b; --no: #ff8270; --no-soft: #3d1f1c;
  --g-strategy: #79a6ff; --g-customer: #ff7a5c; --g-brand: #b996f0; --g-metric: #5fd09a;
  color-scheme: dark;
}
[data-group="strategy"] { --accent: var(--g-strategy); }
[data-group="customer"] { --accent: var(--g-customer); }
[data-group="brand"] { --accent: var(--g-brand); }
[data-group="metric"] { --accent: var(--g-metric); }

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px; opacity: .35;
  mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
}
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
.label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: grid; gap: 10px; }
.mast-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.theme { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.mast h1 { font-size: clamp(38px, 8.5vw, 60px); letter-spacing: -.01em; }
.mast h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
.mast p { margin: 0; color: var(--muted); max-width: 58ch; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 6px; }
.stats div { display: grid; }
.stats b { font-family: "Fraunces", Georgia, serif; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }

/* Thư viện chủ đề */
.library { display: grid; gap: 28px; }
.mix {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; text-align: left;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 18px; padding: 20px 22px;
  transition: transform .2s;
}
.mix:hover { transform: translateY(-2px); }
.mix h3 { font-size: 22px; }
.mix p { margin: 2px 0 0; font-size: 14px; opacity: .75; }
.mix .go { font-family: "JetBrains Mono", monospace; font-size: 13px; border: 1px solid currentColor; border-radius: 99px; padding: 6px 14px; white-space: nowrap; }
.group { display: grid; gap: 12px; }
.group-head { display: flex; align-items: center; gap: 10px; }
.group-head i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.shelf { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.topic {
  text-align: left; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; position: relative; overflow: hidden;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.topic::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); }
.topic:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 12px 30px -20px var(--accent); }
.topic .code { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 20px; color: var(--accent); letter-spacing: .02em; }
.topic h3 { font-size: 19px; }
.topic .en { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.pill { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* Màn chơi */
.game { display: grid; gap: 20px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--accent); }
.hero { display: grid; gap: 4px; }
.hero .code { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--accent); font-size: 15px; letter-spacing: .06em; }
.hero h1 { font-size: clamp(30px, 6.5vw, 44px); }
.hero .en { color: var(--muted); font-size: 15px; }
.recap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
.recap summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.recap summary::-webkit-details-marker { display: none; }
.recap summary::after { content: "+"; font-family: "JetBrains Mono", monospace; color: var(--accent); }
.recap[open] summary::after { content: "−"; }
.recap p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.recap ul { margin: 0 0 14px; padding-left: 18px; font-size: 15px; display: grid; gap: 4px; }
.recap li::marker { color: var(--accent); }
.track { display: grid; grid-auto-flow: column; gap: 3px; }
.track span { height: 6px; border-radius: 3px; background: var(--line); }
.track span.ok { background: var(--ok); }
.track span.no { background: var(--no); }
.track span.now { background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 34px); display: grid; gap: 20px; box-shadow: 0 24px 50px -36px color-mix(in srgb, var(--accent) 70%, transparent); }
.qhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.num, .score { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
.num { color: var(--accent); }
.score { color: var(--muted); }
.tag { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; margin-left: 8px; }
.q { font-size: clamp(20px, 4.2vw, 25px); }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--opt); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); line-height: 1.45;
  transition: border-color .12s, background .12s, transform .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--no); background: var(--no-soft); }
.opt.wrong .key { background: var(--no); border-color: var(--no); color: var(--card); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
.explain strong { font-family: "Fraunces", Georgia, serif; font-size: 19px; }
.explain.ok strong { color: var(--ok); }
.explain.no strong { color: var(--no); }
.explain p { margin: 0; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter .15s; }
[data-group] .btn { color: #fff; }
:root[data-theme="dark"] [data-group] .btn { color: #0f1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-group] .btn { color: #0f1218; } }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink) !important; border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

/* Kết quả */
.big { font-family: "Fraunces", Georgia, serif; font-size: clamp(64px, 16vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 21px; margin: 0; }
.review { display: grid; margin: 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border-bottom: 0; }
.review .mark { font-family: "JetBrains Mono", ui-monospace, monospace; }
.review .mark.ok { color: var(--ok); }
.review .mark.no { color: var(--no); }
.review .ans { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 480px) { .mix { grid-template-columns: 1fr; } .mix .go { justify-self: start; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="mast" id="mast">
    <div class="mast-top">
      <span class="label">Phòng luyện mô hình marketing</span>
      <button class="theme" id="theme" aria-label="Đổi giao diện sáng tối">◐ Giao diện</button>
    </div>
    <h1>Marketing <em>Quiz Lab</em></h1>
    <p>Câu hỏi chuyên sâu về nguồn gốc, cấu trúc và cách áp dụng các mô hình kinh điển. Mỗi đáp án đều có giải thích để bạn hiểu vì sao đúng, vì sao sai.</p>
    <div class="stats" id="stats"></div>
  </header>

  <section id="library" class="library" aria-label="Chọn chủ đề"></section>
  <section id="game" class="game" hidden aria-live="polite"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
const GROUPS = [
  { id: "strategy", name: "Chiến lược & phân tích môi trường" },
  { id: "customer", name: "Khách hàng & marketing mix" },
  { id: "brand", name: "Truyền thông & thương hiệu" },
  { id: "metric", name: "Vòng đời & đo lường" }
];

const TOPICS = [
  {
    id: "3cs", code: "3Cs", group: "strategy", title: "Mô hình 3Cs", en: "Kenichi Ohmae's Strategic Triangle",
    summary: "Kenichi Ohmae (McKinsey) cho rằng chiến lược đúng nằm ở giao điểm của ba bên: khách hàng, công ty và đối thủ. Chiến lược tốt đáp ứng nhu cầu khách hàng tốt hơn đối thủ, dựa trên thế mạnh thật của công ty.",
    keys: ["Customer: nhu cầu, phân khúc, tiêu chí chọn mua", "Company (Ohmae gọi là Corporation): năng lực, nguồn lực, chi phí", "Competitors: điểm mạnh yếu, cách đối thủ đáp ứng cùng nhu cầu", "Mở rộng: 5Cs thêm Collaborators và Context"],
    questions: [
      { q: "Mô hình 3Cs được giới thiệu bởi ai, trong cuốn sách nào?", a: "Kenichi Ohmae, The Mind of the Strategist (1982)", w: ["Philip Kotler, Marketing Management (1967)", "Michael Porter, Competitive Strategy (1980)", "Igor Ansoff, Corporate Strategy (1965)"], e: "Ohmae, khi đó là partner của McKinsey tại Tokyo, gọi đây là \"tam giác chiến lược\" (strategic triangle). Bản tiếng Anh của sách ra năm 1982." },
      { q: "Ba chữ C trong mô hình gốc của Ohmae là gì?", a: "Customer, Corporation (Company), Competitors", w: ["Customer, Cost, Convenience", "Company, Channel, Communication", "Customer, Content, Context"], e: "Ohmae dùng chữ Corporation; phần lớn tài liệu sau này viết là Company. Customer, Cost, Convenience là một phần của 4Cs (Lauterborn)." },
      { q: "Theo Ohmae, một chiến lược thành công cần đạt được điều gì trong tam giác chiến lược?", a: "Đáp ứng nhu cầu khách hàng tốt hơn đối thủ, dựa trên thế mạnh của chính công ty", w: ["Đạt chi phí thấp nhất ngành bất kể khách hàng cần gì", "Sao chép nhanh các sản phẩm thành công của đối thủ", "Giành thị phần lớn nhất ở mọi phân khúc cùng lúc"], e: "Trọng tâm là lợi thế tương đối: khớp thế mạnh công ty với nhu cầu khách hàng theo cách khác biệt so với đối thủ." },
      { q: "Nếu công ty và đối thủ đáp ứng cùng một nhu cầu theo cùng một cách, theo logic 3Cs điều gì dễ xảy ra?", a: "Khách hàng không thấy khác biệt, cạnh tranh trượt dần thành cuộc chiến giá", w: ["Cả hai cùng tăng được biên lợi nhuận", "Quy mô thị trường tự động mở rộng", "Doanh nghiệp lớn hơn luôn thắng nhờ thương hiệu"], e: "Không có khác biệt trong cách đáp ứng nhu cầu, khách chỉ còn so sánh giá. Đó là lý do 3Cs buộc người làm chiến lược nhìn đồng thời cả đối thủ." },
      { q: "Một chuỗi bánh mì phát hiện 60% khách văn phòng muốn nhận hàng trong dưới 3 phút vào giờ cao điểm. Thông tin này thuộc C nào?", a: "Customer", w: ["Company", "Competitors", "Không thuộc 3Cs mà thuộc PESTEL"], e: "Đây là nhu cầu và tiêu chí mua của khách hàng. Nó sẽ trở thành lợi thế nếu Company có năng lực phục vụ nhanh hơn Competitors." },
      { q: "Thông tin nào thuộc phần phân tích Company trong 3Cs?", a: "Năng lực sản xuất, công nghệ, tài chính và văn hoá nội bộ", w: ["Thị phần và chiến lược giá của đối thủ dẫn đầu", "Hành vi mua và tiêu chí lựa chọn của khách", "Tỷ lệ lạm phát và chính sách thuế"], e: "Company là các nguồn lực và năng lực bên trong. Lạm phát và thuế là yếu tố vĩ mô, thường đưa vào Context ở mô hình 5Cs hoặc PESTEL." },
      { q: "Ohmae gợi ý chiến lược dựa trên khách hàng có thể phân khúc theo hai cách nào?", a: "Theo mục đích sử dụng của khách và theo độ phủ khách hàng tối ưu chi phí", w: ["Theo độ tuổi và theo giới tính", "Theo vùng địa lý và theo nền tảng mạng xã hội", "Theo mức giá và theo kiểu bao bì"], e: "Ohmae nói về segmenting by objectives (khách dùng sản phẩm để làm gì) và segmenting by customer coverage (phục vụ bao nhiêu khách thì chi phí marketing còn hiệu quả)." },
      { q: "Mô hình 5Cs mở rộng từ 3Cs bổ sung thêm hai yếu tố nào?", a: "Collaborators và Context (hay Climate)", w: ["Cost và Convenience", "Channel và Communication", "Culture và Creativity"], e: "Collaborators là đối tác, nhà cung cấp, nhà phân phối. Context là môi trường vĩ mô, có thể phân tích sâu bằng PESTEL." },
      { q: "Mô hình nào hay bị nhầm với 3Cs, do Robert Lauterborn đề xuất năm 1990 để nhìn 4P từ phía khách hàng?", a: "4Cs: Consumer, Cost, Convenience, Communication", w: ["5Cs: Company, Customers, Competitors, Collaborators, Context", "7Cs của trải nghiệm khách hàng số", "3Vs: Valued customer, Value proposition, Value network"], e: "4Cs của Lauterborn là phiên bản lấy khách hàng làm trung tâm của marketing mix, khác hoàn toàn mục đích phân tích chiến lược của 3Cs." }
    ]
  },
  {
    id: "five-forces", code: "5F", group: "strategy", title: "Năm lực lượng cạnh tranh", en: "Porter's Five Forces",
    summary: "Michael Porter cho rằng mức lợi nhuận tiềm năng của một ngành do cấu trúc ngành quyết định, thể hiện qua năm lực lượng. Lực càng mạnh, ngành càng khó kiếm lời.",
    keys: ["Cạnh tranh giữa các đối thủ hiện tại", "Đe doạ từ đối thủ mới gia nhập", "Đe doạ từ sản phẩm thay thế", "Quyền thương lượng của người mua", "Quyền thương lượng của nhà cung cấp"],
    questions: [
      { q: "Mô hình Five Forces được công bố lần đầu ở đâu, năm nào?", a: "Harvard Business Review, 1979", w: ["Journal of Marketing, 1960", "Sách Competitive Advantage, 1985", "McKinsey Quarterly, 1982"], e: "Bài \"How Competitive Forces Shape Strategy\" trên HBR năm 1979, sau đó được phát triển trong sách Competitive Strategy (1980)." },
      { q: "Yếu tố nào KHÔNG thuộc năm lực lượng gốc của Porter?", a: "Vai trò của chính phủ", w: ["Đe doạ từ sản phẩm thay thế", "Quyền thương lượng của nhà cung cấp", "Đe doạ từ đối thủ mới gia nhập"], e: "Porter coi chính phủ là yếu tố tác động thông qua năm lực, không phải lực thứ sáu. Các học giả khác hay đề xuất \"complementors\" (sản phẩm bổ trợ) làm lực thứ sáu." },

const MIX_SIZE = 15;
const KEYS = ["A", "B", "C", "D"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const best = {
  get(id) { return Number(store.get("mq-best:" + id)) || 0; },
  set(id, v) { if (v > this.get(id)) store.set("mq-best:" + id, v); }
};
const TOTAL = TOPICS.reduce((n, t) => n + t.questions.length, 0);
const MIX = { id: "tong-hop", code: "MIX", group: null, title: "Thử thách tổng hợp", en: `${MIX_SIZE} câu ngẫu nhiên từ mọi chủ đề` };

// Giao diện sáng / tối
const themeSaved = store.get("mq-theme");
if (themeSaved) document.documentElement.dataset.theme = themeSaved;
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("mq-theme", next);
});

let state = null;

function renderLibrary() {
  const done = TOPICS.filter((t) => best.get(t.id) > 0).length;
  $("#stats").innerHTML = `
    <div><b>${TOPICS.length}</b><span>chủ đề</span></div>
    <div><b>${TOTAL}</b><span>câu hỏi</span></div>
    <div><b>${done}/${TOPICS.length}</b><span>chủ đề đã thử</span></div>`;
  const mixBest = best.get(MIX.id);
  let html = `<button class="mix" data-id="${MIX.id}">
      <span><span class="label" style="color:inherit;opacity:.6">Chế độ ôn luyện</span><h3>${MIX.title}</h3><p>${MIX.en}${mixBest ? ` · Kỷ lục ${mixBest}/${MIX_SIZE}` : ""}</p></span>
      <span class="go">Bắt đầu →</span>
    </button>`;
  html += GROUPS.map((g) => {
    const items = TOPICS.filter((t) => t.group === g.id).map((t) => {
      const b = best.get(t.id);
      return `<button class="topic" data-id="${t.id}" data-group="${t.group}">
        <span class="code">${esc(t.code)}</span>
        <h3>${esc(t.title)}</h3>
        <span class="en">${esc(t.en)}</span>
        <span class="row"><span class="pill">${t.questions.length} câu</span>${b ? `<span class="pill ok">Kỷ lục ${b}/${t.questions.length}</span>` : ""}</span>
      </button>`;
    }).join("");
    return `<div class="group" data-group="${g.id}"><div class="group-head"><i></i><span class="label">${esc(g.name)}</span></div><div class="shelf">${items}</div></div>`;
  }).join("");
  $("#library").innerHTML = html;
  $("#library").querySelectorAll("[data-id]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.id; }));
}

function start(id) {
  let topic, qs;
  if (id === MIX.id) {
    topic = MIX;
    const pool = TOPICS.flatMap((t) => t.questions.map((q) => ({ ...q, from: t })));
    qs = shuffle(pool).slice(0, MIX_SIZE);
  } else {
    topic = TOPICS.find((t) => t.id === id);
    if (!topic) return showLibrary();
    qs = topic.questions.map((q) => ({ ...q, from: topic }));
  }
  qs = qs.map((x) => ({ ...x, opts: shuffle([x.a, ...x.w]) }));
  state = { topic, qs, i: 0, picks: [] };
  $("#mast").hidden = true;
  $("#library").hidden = true;
  $("#game").hidden = false;
  renderQ();
  renderFoot();
  window.scrollTo(0, 0);
}

function showLibrary() {
  state = null;
  $("#mast").hidden = false;
  $("#game").hidden = true;
  $("#library").hidden = false;
  document.body.removeAttribute("data-group");
  renderLibrary();
  renderFoot();
}

function correct() { return state.picks.filter((p, k) => p === state.qs[k].a).length; }

function track() {
  return `<div class="track" aria-hidden="true">${state.qs.map((q, k) => {
    const p = state.picks[k];
    const cls = p === undefined ? (k === state.i ? "now" : "") : (p === q.a ? "ok" : "no");
    return `<span class="${cls}"></span>`;
  }).join("")}</div>`;
}

function header() {
  const t = state.topic;
  const recap = t.summary && state.i === 0 && state.picks.length === 0
    ? `<details class="recap"><summary>Ôn nhanh trước khi làm</summary><p>${esc(t.summary)}</p><ul>${t.keys.map((k) => `<li>${esc(k)}</li>`).join("")}</ul></details>`
    : "";
  return `
    <div class="topbar">
      <button class="back" id="back">← Tất cả chủ đề</button>
      <span class="label">${esc(t.en)}</span>
    </div>
    <div class="hero"><span class="code">${esc(t.code)}</span><h1>${esc(t.title)}</h1></div>
    ${recap}
    ${track()}`;
}

function renderQ() {
  const { qs, i } = state;
  const q = qs[i];
  document.body.dataset.group = (state.topic.group || q.from.group);
  const picked = state.picks[i];
  const done = picked !== undefined;
  const ok = picked === q.a;
  const tag = state.topic === MIX ? `<span class="tag">${esc(q.from.code)}</span>` : "";
  $("#game").innerHTML = `${header()}
    <article class="card">
      <div class="qhead"><span class="num">Câu ${String(i + 1).padStart(2, "0")} / ${qs.length}${tag}</span><span class="score">Đúng ${correct()}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = "";
        if (done && o === q.a) cls = "right";
        else if (done && o === picked) cls = "wrong";
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${done ? "disabled" : ""}><span class="key">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${done ? `<div class="explain ${ok ? "ok" : "no"}"><strong>${ok ? "Chính xác!" : "Chưa đúng. Đáp án: " + esc(q.a)}</strong><p>${esc(q.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${i + 1 < qs.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>` : ""}
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#game").querySelectorAll(".opt:not(:disabled)").forEach((b) => b.addEventListener("click", () => pick(b.dataset.o)));
  const nx = $("#next");
  if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
}

function pick(o) {
  if (state.picks[state.i] !== undefined) return;
  state.picks[state.i] = o;
  renderQ();
}

function next() {
  if (state.i + 1 < state.qs.length) { state.i++; renderQ(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else renderResult();
}

function verdict(r) {
  if (r === 1) return "Nắm vững như giảng viên. Bạn hiểu cả nguồn gốc lẫn cách áp dụng.";
  if (r >= .75) return "Rất chắc tay. Chỉ còn vài chi tiết cần ôn lại.";
  if (r >= .5) return "Nền tảng ổn. Đọc lại phần giải thích để lấp chỗ hổng.";
  return "Nên mở phần ôn nhanh và thử lại một lượt nữa.";
}

function renderResult() {
  const { topic, qs } = state;
  const c = correct();
  best.set(topic.id, c);
  if (topic === MIX) document.body.removeAttribute("data-group");
  $("#game").innerHTML = `${header()}
    <article class="card result">
      <span class="label">Kết quả</span>
      <div class="big">${c}<small> / ${qs.length}</small></div>
      <p class="verdict">${verdict(c / qs.length)}</p>
      <ul class="review">${qs.map((q, k) => {
        const ok = state.picks[k] === q.a;
        return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><span>${esc(q.q)}<br><span class="ans">${ok ? esc(q.a) : `Bạn chọn: ${esc(state.picks[k])} · Đáp án: ${esc(q.a)}`}</span></span></li>`;
      }).join("")}</ul>
      <div class="actions">
        <button class="btn ghost" id="lib">Chọn chủ đề khác</button>
        <button class="btn" id="again">Làm lại</button>
      </div>
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#lib").addEventListener("click", () => { location.hash = ""; });
  $("#again").addEventListener("click", () => start(topic.id));
  window.scrollTo(0, 0);
}

function renderFoot() {
  $("#foot").textContent = state
    ? "Mẹo: bấm phím A, B, C, D để chọn đáp án nhanh. Thứ tự đáp án được xáo lại mỗi lượt."
    : "Kỷ lục chỉ lưu trên trình duyệt của bạn. Nội dung tổng hợp từ các tài liệu gốc của từng tác giả và giáo trình marketing phổ biến.";
}

function route() {
  const id = location.hash.slice(1);
  if (id === MIX.id || TOPICS.some((t) => t.id === id)) { if (!state || state.topic.id !== id) start(id); }
  else showLibrary();
}

document.addEventListener("keydown", (e) => {
  if (!state || $("#game").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KEYS.indexOf(e.key.toUpperCase());
  const btns = $("#game").querySelectorAll(".opt:not(:disabled)");
  if (k >= 0 && btns[k]) btns[k].click();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
